<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ads Refiner</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 400px; min-height: 460px; padding: 0; }
    .popup-wrap { padding: 0.9rem; display: flex; flex-direction: column; gap: 0.75rem; }

    .header { display: flex; align-items: center; justify-content: space-between; }
    .logo   { display: flex; align-items: center; gap: 0.5rem; }
    .logo img { width: 28px; height: 28px; }
    .logo h1  { margin: 0; font-size: 1.1rem; }
    .header-actions { display: flex; gap: 0.4rem; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .stat-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.6rem 0.5rem; text-align: center;
    }
    .stat-num   { font-size: 1.4rem; font-weight: 800; line-height: 1; color: var(--accent); }
    .stat-label { font-size: 0.68rem; color: var(--muted); margin-top: 0.2rem;
                  text-transform: uppercase; letter-spacing: 0.06em; }

    .toggle-group { display: grid; gap: 0.4rem; }
    .mini-toggle  {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.4rem 0.7rem; font-size: 0.85rem;
    }
    .mini-toggle .toggle-label {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.4rem; cursor: pointer; width: 100%;
      user-select: none;
    }
    .toggle-text { flex: 1; }

    /* Compact toggle switch */
    .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider {
      position: absolute; inset: 0;
      background: var(--border); border-radius: 20px;
      transition: 0.25s; cursor: pointer;
    }
    .slider::before {
      content:''; position: absolute;
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background: white; border-radius: 50%;
      transition: 0.25s;
    }
    input:checked + .slider { background: var(--safe); }
    input:checked + .slider::before { transform: translateX(18px); }

    .section-title { font-size: 0.78rem; font-weight: 700; color: var(--muted);
                     text-transform: uppercase; letter-spacing: 0.08em; margin: 0; }
    .threats { display: grid; gap: 0.6rem; max-height: 220px; overflow-y: auto; }
    .threat { border: 1px solid var(--border); border-radius: 12px; padding: 0.65rem; }
    .threat-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.4rem; }
    .threat h3 { margin: 0; font-size: 0.88rem; overflow-wrap: anywhere; flex: 1; }
    .threat ul { margin: 0.3rem 0 0; padding-left: 1.2rem; font-size: 0.8rem; color: var(--muted); }
    .threat ul li { margin-bottom: 0.15rem; }
    .risk-badge { font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.45rem;
                  border-radius: 999px; white-space: nowrap; }
    .risk-dangerous { background: #fee2e2; color: #7f1d1d; }
    .risk-suspicious { background: #fef3c7; color: #78350f; }
    .empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 1rem 0; }
    .action-sm { font-size: 0.75rem; padding: 0.25rem 0.6rem; }
    .footer { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .btn-ghost { background: var(--bg); border: 1px solid var(--border); color: var(--text);
                 border-radius: 999px; font-size: 0.78rem; padding: 0.4rem 0.8rem; cursor: pointer;
                 font-weight: 600; transition: background 0.15s; }
    .btn-ghost:hover { background: var(--border); }
    #status { font-size: 0.82rem; color: var(--muted); margin: 0; }
    .free-pill { background: var(--safe-bg); color: var(--safe); border: 1px solid var(--safe);
                 border-radius: 999px; font-size: 0.65rem; font-weight: 800;
                 padding: 0.1rem 0.45rem; margin-left: 0.3rem; vertical-align: middle; }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex; border-bottom: 1px solid var(--border);
      margin: -0.9rem -0.9rem 0.75rem; padding: 0 0.9rem;
      background: var(--card);
    }
    .tab-btn {
      flex: 1; background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 0.78rem; font-weight: 600;
      color: var(--muted); padding: 0.55rem 0.4rem;
      border-bottom: 2.5px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 0.3rem;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Panel visibility ──
       Controlled entirely via inline style.display in popup.js (switchTab).
       Always set to an explicit 'block'/'none' there — never '' — otherwise
       clearing the inline style falls back to no rule here and the panel
       stays at its default 'display: block', or (if a rule exists) whatever
       that rule says, regardless of which tab is active. */

    /* ── System panel tiles ── */
    .sys-stat-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem; margin-bottom: 0.65rem;
    }
    .sys-tile {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.55rem 0.4rem; text-align: center;
    }
    .sys-tile .s-num {
      font-size: 1.15rem; font-weight: 800; color: var(--accent); line-height: 1;
    }
    .sys-tile .s-lbl {
      font-size: 0.62rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.15rem;
    }

    /* ── RAM bar ── */
    .ram-section { margin-bottom: 0.65rem; }
    .ram-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.75rem; color: var(--muted); margin-bottom: 0.3rem;
    }
    .live-dot {
      display: inline-block; width: 6px; height: 6px;
      background: var(--safe); border-radius: 50%;
      animation: blink 1.4s ease-in-out infinite; margin-right: 0.3rem;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
    .ram-track {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 999px; height: 9px; overflow: hidden;
    }
    .ram-fill {
      height: 100%; border-radius: 999px;
      background: var(--accent); transition: width 0.6s ease;
    }
    .ram-fill.warn   { background: var(--warn); }
    .ram-fill.danger { background: var(--danger); }
    .ram-sub { font-size: 0.68rem; color: var(--muted); margin-top: 0.25rem; }

    /* ── Site time list ── */
    .sys-section-title {
      font-size: 0.72rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 0.5rem 0 0.35rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .site-rows { display: grid; gap: 0.3rem; max-height: 160px; overflow-y: auto; }
    .site-row {
      display: grid; grid-template-columns: 16px 1fr auto;
      align-items: center; gap: 0.4rem; font-size: 0.8rem;
      padding: 0.3rem 0.5rem;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    .site-row img { width: 14px; height: 14px; border-radius: 2px; object-fit: contain; }
    .site-row .s-host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site-row .s-time { font-size: 0.72rem; color: var(--muted); white-space: nowrap; font-weight: 700; }
    .empty-sys { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 0.75rem 0; }
  </style>
</head>
<body>
<div class="popup-wrap">

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabMain">&#x1F6E1; Protection</button>
    <button class="tab-btn"        id="tabSys">&#x1F5A5; System</button>
  </div>

  <!-- ══ Main panel ══ -->
  <div id="mainPanel">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img src="icons/icon128.png" alt="">
      <h1>Ads Refiner <span class="free-pill">FREE</span></h1>
    </div>
    <div class="header-actions">
      <button class="btn-ghost" id="btnDashboard" title="Analytics dashboard">📊</button>
      <button class="btn-ghost" id="btnOptions" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- Status -->
  <p id="status"></p>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="statAds">—</div>
      <div class="stat-label">Ads Blocked</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statTrackers">—</div>
      <div class="stat-label">Trackers</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statUrls">—</div>
      <div class="stat-label">URLs Blocked</div>
    </div>
  </div>

  <!-- Toggles -->
  <div class="toggle-group">
    <div class="mini-toggle">
      <label class="toggle-label" for="tgEnabled">
        <span class="toggle-text">🛡 Protection enabled</span>
        <span class="switch"><input id="tgEnabled" type="checkbox"><span class="slider"></span></span>
      </label>
    </div>
    <div class="mini-toggle">
      <label class="toggle-label" for="tgAds">
        <span class="toggle-text">🚫 Block ads</span>
        <span class="switch"><input id="tgAds" type="checkbox"><span class="slider"></span></span>
      </label>
    </div>
    <div class="mini-toggle">
      <label class="toggle-label" for="tgTrackers">
        <span class="toggle-text">👣 Block trackers</span>
        <span class="switch"><input id="tgTrackers" type="checkbox"><span class="slider"></span></span>
      </label>
    </div>
    <div class="mini-toggle">
      <label class="toggle-label" for="tgLinks">
        <span class="toggle-text">🔗 Warn suspicious links</span>
        <span class="switch"><input id="tgLinks" type="checkbox"><span class="slider"></span></span>
      </label>
    </div>
    <div class="mini-toggle">
      <label class="toggle-label" for="tgDownloads">
        <span class="toggle-text">⬇ Block risky downloads</span>
        <span class="switch"><input id="tgDownloads" type="checkbox"><span class="slider"></span></span>
      </label>
    </div>
    <div class="mini-toggle">
      <label class="toggle-label" for="tgCosmetic">
        <span class="toggle-text">🎨 Cosmetic ad hiding</span>
        <span class="switch"><input id="tgCosmetic" type="checkbox"><span class="slider"></span></span>
      </label>
    </div>
  </div>

  <!-- Scan -->
  <button id="scan" class="button safe full">🔍 Scan browser now</button>

  <!-- Whitelist quick-add -->
  <div style="display:flex; gap:0.4rem;">
    <input id="whitelistInput" class="text-input" placeholder="Whitelist a domain…" style="flex:1">
    <button id="btnWhitelistAdd" class="button neutral action-sm">Add</button>
  </div>

  <!-- Threats -->
  <div>
    <p class="section-title">Suspicious items <span id="threatCount"></span></p>
    <div id="threats" class="threats"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn-ghost" id="btnExportJson">⬇ Export JSON</button>
    <button class="btn-ghost" id="btnExportCsv">⬇ Export CSV</button>
    <button class="btn-ghost" id="btnClearLog">🗑 Clear log</button>
  </div>

  </div><!-- /mainPanel -->

  <!-- ══ System panel ══ -->
  <div id="sysPanel">

    <!-- Top stats -->
    <div class="sys-stat-row">
      <div class="sys-tile">
        <div class="s-num" id="sysSession">—</div>
        <div class="s-lbl">Session</div>
      </div>
      <div class="sys-tile">
        <div class="s-num" id="sysToday">—</div>
        <div class="s-lbl">Today</div>
      </div>
      <div class="sys-tile">
        <div class="s-num" id="sysRam">—</div>
        <div class="s-lbl">Chrome RAM</div>
      </div>
    </div>

    <!-- RAM bar -->
    <div class="ram-section">
      <div class="ram-header">
        <span><span class="live-dot"></span> RAM usage</span>
        <span id="sysRamPct" style="font-size:0.7rem"></span>
      </div>
      <div class="ram-track"><div class="ram-fill" id="sysRamBar" style="width:0%"></div></div>
      <div class="ram-sub" id="sysRamSub">Loading…</div>
    </div>

    <!-- Today per site -->
    <div class="sys-section-title">
      <span>⏱ Time per site — today</span>
      <a id="sysOpenFull">Full view →</a>
    </div>
    <div class="site-rows" id="sysSiteRows">
      <div class="empty-sys">Loading…</div>
    </div>

  </div><!-- /sysPanel -->

</div>
<script src="crossbrowser.js"></script>
<script src="favicon.js"></script>
<script src="popup.js"></script>
</body>
</html>
