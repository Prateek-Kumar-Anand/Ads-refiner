<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suspicious link blocked</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="page">
    <main class="card warning-card">
      <p class="eyebrow">Ads Refiner safety check</p>
      <h1>This link looks suspicious</h1>
      <p id="target" class="target"></p>
      <ul id="reasons" class="reasons"></ul>
      <div class="actions">
        <button id="goBack" class="button safe">Go back</button>
        <button id="continue" class="button danger">Go on anyway</button>
      </div>
      <p class="note">Only continue when you trust the website and understand the risk.</p>
    </main>
    <script src="warning.js"></script>
  </body>
</html>
